[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "react"
version = "1.0.0"
description = "Local-first AI coding agent"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "ollama>=0.2.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
react = "react.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
